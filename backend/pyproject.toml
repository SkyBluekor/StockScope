[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["runtime", "runtime.*", "tests", "tests.*"]
namespaces = false

[project]
name = "stockscope-backend"
version = "0.1.0"
description = "StockScope investment analysis backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.2",
    "starlette==0.50.0",
    "uvicorn[standard]==0.48.0",
    "httpx==0.28.1",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "tzdata==2026.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
